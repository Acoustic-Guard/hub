server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/acousticguard
    username: postgres
    password: password

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  grpc:
    client:
      channels:
        python-classifier:
          address: "localhost:50051"
          negotiation-type: plaintext

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration: 86400000

acoustic:
  classifier:
    confidence-threshold: 0.10
  sensor:
    heartbeat-timeout-seconds: 10
  incident:
    spatial-threshold-meters: 500
    temporal-threshold-seconds: 300