server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/acoustic
    username: acoustic
    password: secret
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    enabled: true
  grpc:
    client:
      channels:
        python-classifier:
          address: "localhost:50051"

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration: 86400000

acoustic:
  classifier:
    confidence-threshold: 0.75
  sensor:
    heartbeat-timeout-seconds: 10
  incident:
    spatial-threshold-meters: 500
    temporal-threshold-seconds: 300
